[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pet-detective"
version = "0.1.0"
description = "Local-first dog activity detection, tracking and reporting"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python>=4.9", "ultralytics>=8.3"]
youtube = ["yt-dlp>=2025.1.15"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8"]

[project.scripts]
petdetective = "pet_detective.cli:main"

[tool.setuptools.packages.find]
include = ["pet_detective*"]
